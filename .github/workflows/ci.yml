name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sigoe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sigoe_test
      SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev shared-mime-info graphviz imagemagick
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
          working-directory: backend
      - run: cp config/database.yml.example config/database.yml
      - run: bundle exec rails db:prepare
      - run: bundle exec rspec
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sigoe-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sigoe-ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
